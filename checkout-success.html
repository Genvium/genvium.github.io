<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Successful | Genvium Plus</title>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-3B9XYFVLCV"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-3B9XYFVLCV');
  </script>

  <style>
    /* Base Genvium Styles */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Inter, Arial, sans-serif;
      background: #F4F7FA;
      color: #111827;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #E5E7EB;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 40px;
    }
    .logo {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #0F172A;
      text-decoration: none;
    }
    nav a {
      margin-left: 26px;
      text-decoration: none;
      color: #374151;
      font-size: 15px;
      transition: 0.2s ease;
      cursor: pointer;
    }
    nav a:hover { color: #2563EB; }
    
    /* Button Styles */
    .btn-primary {
      display: inline-block;
      background: #2563EB;
      color: white;
      padding: 14px 26px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      transition: 0.2s ease;
      cursor: pointer;
      border: none;
      font-size: 16px;
    }
    .btn-primary:hover {
      background: #1D4ED8;
      transform: translateY(-1px);
    }
    .btn-secondary {
      display: inline-block;
      border: 1px solid #CBD5E1;
      color: #111827;
      padding: 14px 26px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      background: white;
      transition: 0.2s ease;
      cursor: pointer;
      font-size: 16px;
    }
    .btn-secondary:hover {
      border-color: #94A3B8;
      background: #F8FAFC;
    }

    /* Checkout Specific Styles */
    .checkout-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
    }
    .checkout-card {
      background: white;
      border-radius: 24px;
      padding: 50px 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      border: 1px solid #E5E7EB;
      box-shadow: 0 20px 40px rgba(0,0,0,0.04);
      animation: fadeUp 0.4s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .icon-circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }
    .icon-success {
      background: #DCFCE7;
      color: #16A34A;
    }
    .checkout-card h1 {
      font-size: 32px;
      letter-spacing: -1px;
      margin-bottom: 16px;
      color: #0F172A;
    }
    .checkout-card p {
      font-size: 16px;
      color: #4B5563;
      margin-bottom: 32px;
      line-height: 1.7;
    }
    .action-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Footer */
    footer {
      background: #0081B3;
      padding: 25px 40px;
      text-align: center;
      font-size: 13px;
      color: white;
    }
    footer p { color: rgba(255,255,255,0.85); }

    @media (max-width: 768px) {
      header { flex-direction: column; gap: 18px; }
      nav a { margin: 0 10px; }
      .checkout-card { padding: 40px 24px; }
    }
  </style>
</head>

<body>

<header>
  <a href="https://genvium.com" class="logo">Genvium</a>
  <nav>
    <a href="https://genvium.com">Home</a>
    <a href="https://genvium.com#contact">Contact</a>
  </nav>
</header>

<main class="checkout-wrapper">
  <div class="checkout-card">
    <div class="icon-circle icon-success">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
    <h1>Payment Successful!</h1>
    <p>Welcome to <strong>Genvium Plus</strong>. Your account has been successfully upgraded. You can now close this window and return to the Genvium app to start exploring advanced funding opportunities.</p>
    
    <div class="action-group">
      <!-- Using window.close() works well if opened via a desktop app or popup link -->
      <button onclick="window.close()" class="btn-primary">Close this window</button>
      <a href="https://genvium.com" class="btn-secondary">Return to website</a>
    </div>
  </div>
</main>

<footer>
  <p>© 2026 Auduvant Technologies. All rights reserved.</p>
</footer>

</body>
</html>
